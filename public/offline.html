<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F9F7F3">
<title>Offline · Fenn</title>
<style>
  body { margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center; background: #F9F7F3; color: #2C2724;
         font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding: 24px; box-sizing: border-box; }
  main { max-width: 340px; text-align: center; }
  img { width: 72px; height: 72px; }
  h1 { font-size: 20px; margin: 16px 0 8px; }
  p { font-size: 15px; line-height: 1.5; color: #6E655F; margin: 0 0 20px; }
  button { font: inherit; font-weight: 800; font-size: 15px; color: #fff; background: #B85B3F; border: 0; border-radius: 12px; padding: 12px 20px; min-height: 44px; cursor: pointer; }
  button:focus-visible { outline: 3px solid #2C2724; outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <img src="/icons/fenn.svg" alt="">
  <h1>You're offline</h1>
  <p>Room videos and messages need a connection. Your drafts are saved; you can pick up where you left off.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
